<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/log.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChongZi Tiếng Trung</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ChongZi" />
  <link rel="apple-touch-icon" href="/log.png" />
  <script>
    // Global fallback for script/style load failures (e.g., after new deployments with new hashes)
    (function () {
      function forceFreshReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let reg of registrations) {
              reg.unregister();
            }
          });
        }
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          });
        }
        setTimeout(function () {
          window.location.reload(true);
        }, 250);
      }

      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Resource load failed. Clearing cache and reloading...', e.target.src || e.target.href);
          forceFreshReload();
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        const message = e.reason && e.reason.message || '';
        if (
          message.indexOf('Failed to fetch dynamically imported module') > -1 ||
          message.indexOf('Importing a module script failed') > -1 ||
          message.indexOf('error loading dynamically imported module') > -1
        ) {
          console.warn('Dynamic chunk load failure. Clearing cache and reloading...', message);
          forceFreshReload();
        }
      });
    })();
  </script>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
  </script>
</body>

</html>
